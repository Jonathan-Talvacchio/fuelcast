name: Backtest model

on:
  workflow_dispatch:
    inputs:
      years:
        description: Years of history to test
        default: "10"
      sweep:
        description: Also sweep alternative constants
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: backtest
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Run tests
        run: node --test scripts/test-predict.mjs

      - name: Run backtest
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          # Inputs go through env, never straight into the script, so they can't inject shell.
          YEARS: ${{ inputs.years }}
          SWEEP: ${{ inputs.sweep && '--sweep' || '' }}
        run: |
          set -o pipefail
          [[ "$YEARS" =~ ^[0-9]{1,2}$ ]] || { echo "years must be a number, got '$YEARS'"; exit 1; }
          node scripts/backtest.mjs --years "$YEARS" $SWEEP --report | tee backtest.log

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backtest-results
          path: |
            docs/BACKTEST.md
            backtest.log

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/BACKTEST.md
          if git diff --cached --quiet; then echo "No change."; else
            git commit -m "backtest: refresh results $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
