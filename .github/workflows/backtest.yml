name: Backtest model

on:
  workflow_dispatch:
    inputs:
      years:
        description: Years of history to test
        default: "10"
      sweep:
        description: Also sweep alternative constants
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: backtest
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run tests
        run: node --test scripts/test-predict.mjs

      - name: Run backtest
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: node scripts/backtest.mjs --years ${{ inputs.years }} ${{ inputs.sweep && '--sweep' || '' }} --report | tee backtest.log

      - uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: |
            docs/BACKTEST.md
            backtest.log

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/BACKTEST.md
          if git diff --cached --quiet; then echo "No change."; else
            git commit -m "backtest: refresh results $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
